name: imgbot — image optimization

# Optimisation SANS PERTE des images du blog (jpegoptim/optipng : strip
# métadonnées + Huffman, pixels identiques). Tourne sur main (cron + manuel)
# et ouvre une PR avec les fichiers allégés ; merge = blog plus rapide.

on:
  schedule:
    - cron: '0 4 * * 1'   # chaque lundi 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the blog
        uses: actions/checkout@v4

      - name: Install lossless optimizers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jpegoptim optipng

      - name: Optimize images (lossless, per-file tolerant)
        run: |
          find img -type f \( -name '*.jpg' -o -name '*.jpeg' \) -print0 |
            xargs -0 -I{} sh -c 'jpegoptim --strip-all "{}" || echo "::warning::jpegoptim failed on {}"'
          find img -type f -name '*.png' -print0 |
            xargs -0 -I{} sh -c 'optipng -o2 -silent "{}" || echo "::warning::optipng failed on {}"'

      - name: Commit and push if anything shrank
        run: |
          git config user.name "imgbot"
          git config user.email "noirebox-bot@noirebox.eu"
          git add img
          if git diff --cached --quiet; then
            echo "rien à optimiser — déjà au poids plancher"
            exit 0
          fi
          git commit -m "imgbot: optimisation sans perte des images"
          git pull --rebase -q origin main
          git push
          git diff HEAD~1 HEAD --stat | tail -5
